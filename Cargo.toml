[workspace]
resolver = "2"
members = [
    "crates/kinema-core",
    "crates/kinema-db",
    "crates/kinema-scanner",
    "crates/kinema-media",
    "crates/kinema-meta",
    "backend",
]

[workspace.package]
version = "0.0.1-alpha.1"
edition = "2024"
license = "MIT"
authors = ["Kinema Contributors"]

[workspace.dependencies]
kinema-core = { path = "crates/kinema-core" }
kinema-db = { path = "crates/kinema-db" }
kinema-scanner = { path = "crates/kinema-scanner" }
kinema-media = { path = "crates/kinema-media" }
kinema-meta = { path = "crates/kinema-meta" }

# Async runtime & Web
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header", "compression-gzip"] }

# Serialization & config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Tracing & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Utilities
walkdir = "2.5"
notify = "6.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }

# HTTPS (self-signed by default, apps pin the fingerprint)
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
