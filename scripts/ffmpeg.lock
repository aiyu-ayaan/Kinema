# ffmpeg bundled into the server tarball (scripts/package-server.sh). The Docker image uses Alpine's own.
# BtbN's GPL builds: glibc 2.28+ (any distro since 2018), x86_64 and aarch64.
# Their dated tags are deleted after a few weeks, so the `latest` build of this release line is
# fetched and checked against the checksums.sha256 published next to it.
# shortcut: the exact build changes between releases of Kinema; mirror the archives into our own
# release if byte-for-byte reproducible bundles start to matter.
version=8.1
source=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
